<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ned Oliver Newsroom Planner</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Ned Oliver Newsroom Planner</h1>
    <div class="topbar-actions">
      <button id="newStoryBtn">+ New Story</button>
      <label class="toggle">
        <input type="checkbox" id="remindersToggle" />
        <span>In-app reminders</span>
      </label>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card">
        <h2>Due Next 48 Hours</h2>
        <ul id="dueSoonList" class="compact-list"></ul>
      </section>

      <section class="card">
        <h2>Filters</h2>
        <label>
          Reporter
          <input type="text" id="reporterFilter" placeholder="Filter by reporter" />
        </label>
        <label>
          Status
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option>In reporting</option>
            <option>Editing</option>
            <option>Ready</option>
            <option>Published</option>
          </select>
        </label>
        <label>
          Budget Line
          <input type="text" id="budgetFilter" placeholder="Filter by budget line" />
        </label>
        <button id="clearFiltersBtn" class="secondary">Clear Filters</button>
      </section>

      <section class="card">
        <h2>Stories</h2>
        <ul id="storyList" class="story-list"></ul>
      </section>
    </aside>

    <section class="content card">
      <div id="calendar"></div>
    </section>
  </main>

  <dialog id="storyModal">
    <form id="storyForm" method="dialog">
      <h2 id="storyModalTitle">New Story</h2>
      <input type="hidden" id="storyId" />
      <label>Title <input id="titleInput" required /></label>
      <label>Reporter <input id="reporterInput" required /></label>
      <label>Budget Line <input id="budgetInput" required /></label>
      <label>Art Notes <textarea id="artNotesInput" rows="2"></textarea></label>
      <label>Expected File Date & Time <input type="datetime-local" id="fileTimeInput" required /></label>
      <label>Status
        <select id="statusInput" required>
          <option>In reporting</option>
          <option>Editing</option>
          <option>Ready</option>
          <option>Published</option>
        </select>
      </label>
      <menu>
        <button type="button" id="cancelModalBtn" class="secondary">Cancel</button>
        <button type="submit">Save</button>
      </menu>
    </form>
  </dialog>

  <dialog id="detailModal">
    <article>
      <header class="detail-header">
        <h2 id="detailTitle"></h2>
        <button id="editFromDetailBtn">Edit</button>
      </header>
      <p><strong>Reporter:</strong> <span id="detailReporter"></span></p>
      <p><strong>Budget Line:</strong> <span id="detailBudget"></span></p>
      <p><strong>Status:</strong> <span id="detailStatus"></span></p>
      <p><strong>Expected File Time:</strong> <span id="detailFileTime"></span></p>
      <p><strong>Art Notes:</strong> <span id="detailArtNotes"></span></p>

      <section>
        <h3>Comments</h3>
        <ul id="commentsList" class="compact-list"></ul>
        <form id="commentForm">
          <input id="commentAuthorInput" placeholder="Your name" required />
          <input id="commentBodyInput" placeholder="Comment" required />
          <button type="submit">Add Comment</button>
        </form>
      </section>

      <section>
        <h3>Activity Log</h3>
        <ul id="activityList" class="compact-list"></ul>
      </section>

      <menu>
        <button id="closeDetailBtn" class="secondary">Close</button>
        <button id="deleteStoryBtn" class="danger">Delete Story</button>
      </menu>
    </article>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
